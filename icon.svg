<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand violet "aura" gradient (app accent #7000ff → #9d7bff) -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A17C8"/>
      <stop offset="0.55" stop-color="#7000FF"/>
      <stop offset="1" stop-color="#9D7BFF"/>
    </linearGradient>
    <!-- Soft luminous halo = the "aura" -->
    <radialGradient id="halo" cx="0.42" cy="0.40" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#C9B3FF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2A0A66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full-bleed background (store icon has no transparency) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- Back tile: the "duplicate" copy, ghosted -->
  <rect x="132" y="132" width="196" height="196" rx="44" fill="#FFFFFF" opacity="0.34"/>

  <!-- Front tile: solid photo card -->
  <g filter="url(#soft)">
    <rect x="184" y="184" width="196" height="196" rx="44" fill="#FFFFFF"/>
    <!-- Photo glyph: sun + mountains, in brand violet -->
    <clipPath id="tileClip"><rect x="184" y="184" width="196" height="196" rx="44"/></clipPath>
    <g clip-path="url(#tileClip)">
      <circle cx="242" cy="240" r="20" fill="#7000FF"/>
      <path d="M184 372 L246 300 L286 338 L330 288 L380 336 L380 380 L184 380 Z" fill="#7000FF" opacity="0.9"/>
    </g>
  </g>

  <!-- Sparkle to reinforce the "aura / clean" feel -->
  <path d="M372 150 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7 z" fill="#FFFFFF" opacity="0.92"/>
</svg>
